[package]
name = "micro-optimize-algo"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "A collection of micro-optimized algorithms"
license = "GPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/your-username/micro-optimize-algo"

[lib]
path = "src/lib.rs"

[[bin]]
name = "micro-algo"
path = "src/bin/all.rs"

[dependencies]
rand = "0.9"
libc = "0.2"
terminal_size = "0.4"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
anyhow = "1.0"
clap = { version = "4.4", features = ["derive"] }
micro-optimize-algo-macros = { path = "macros" }
libm = "=0.2.16"
micromath = "=2.1.0"
fastapprox = "=0.3.1"

[build-dependencies]
cc = "1.0"
glob = "0.3"
syn = { version = "2.0", features = ["full"] }
quote = "1.0"
proc-macro2 = "1.0"
walkdir = "2"

[dev-dependencies]
syn = { version = "2.0", features = ["full"] }
quote = "1.0"
proc-macro2 = "1.0"
walkdir = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[features]
# cpu_cycles is enabled by default for precise micro-benchmarking
# To disable: --no-default-features or use the 'use_time' feature instead
default = ["cpu_cycles"]
avx2 = []
c_impl = []
cpu_cycles = []
# Use wall-clock time instead of CPU cycles (disables cpu_cycles)
use_time = []
